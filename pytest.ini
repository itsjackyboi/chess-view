[pytest]
asyncio_mode = auto
testpaths = packages services
# importlib mode lets several test directories share the name "tests" without
# colliding as packages, so each service keeps its tests beside its code.
addopts = --import-mode=importlib

# Our own deprecation warnings are errors; third-party ones are not ours to fix and
# would otherwise fail collection outright. Each ignore is pinned to a specific
# message so a new deprecation elsewhere still surfaces.
filterwarnings =
    error::DeprecationWarning
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
    ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning
    ignore:websockets.legacy is deprecated:DeprecationWarning
    ignore:remove second argument of ws_handler:DeprecationWarning
