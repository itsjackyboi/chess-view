[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chessview-protocol"
version = "0.1.0"
description = "Shared wire protocol for the ChessView client and services"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[tool.setuptools]
packages = ["chessview_protocol"]
