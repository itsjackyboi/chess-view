# Maps WorldGuard region IDs to SoundCloud sets/tracks and a target volume.
# The region ID is the WorldGuard region name. When a player is inside several
# overlapping regions, the highest-priority region that has a mapping here wins.

regions:
  tavern:
    url: "https://soundcloud.com/user/sets/tavern"
    volume: 80
  harbor:
    url: "https://soundcloud.com/user/sets/harbor"
    volume: 65

# Used when the player is in no mapped region.
default:
  url: ""      # empty = silence
  volume: 0
