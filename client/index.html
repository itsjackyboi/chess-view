<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pintland Audio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Themed gate that also satisfies the browser autoplay gesture requirement. -->
  <div id="overlay" class="overlay">
    <div class="overlay-card">
      <div class="crest">&#9876;</div>
      <h1>Pintland</h1>
      <p class="tagline">Regional ambience awaits, traveler.</p>
      <button id="enter" class="enter-btn" type="button">Tap to enter Pintland</button>
      <p id="status" class="status">Connecting&hellip;</p>
    </div>
  </div>

  <!-- Shown if a play() gets rejected after entering (e.g. tab throttled). -->
  <div id="banner" class="banner" hidden>
    <span>Audio was blocked &mdash; tap anywhere to enable.</span>
  </div>

  <!-- Two hidden SoundCloud widgets we crossfade between. -->
  <div class="widgets" aria-hidden="true">
    <iframe id="widgetA" title="audio-a" allow="autoplay"
      frameborder="0" scrolling="no"
      src="https://w.soundcloud.com/player/?url="></iframe>
    <iframe id="widgetB" title="audio-b" allow="autoplay"
      frameborder="0" scrolling="no"
      src="https://w.soundcloud.com/player/?url="></iframe>
  </div>

  <script src="https://w.soundcloud.com/player/api.js"></script>
  <script src="app.js"></script>
</body>
</html>
